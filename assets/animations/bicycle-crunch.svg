<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animation bicycle crunch">
  <style>
    .trait { stroke: #d4a24c; stroke-width: 20; stroke-linecap: round; fill: none; }
    .articulation { fill: #f5f3ee; }
    .tete { fill: #f5f3ee; stroke: #d4a24c; stroke-width: 6; }
    .sol { stroke: rgba(245,243,238,0.18); stroke-width: 4; stroke-dasharray: 10 10; }

    .pose-a { animation: fondu-a 1.6s ease-in-out infinite; }
    .pose-b { animation: fondu-b 1.6s ease-in-out infinite; }

    @keyframes fondu-a {
      0%, 30%   { opacity: 1; }
      50%, 80%  { opacity: 0; }
      100%      { opacity: 1; }
    }
    @keyframes fondu-b {
      0%, 30%   { opacity: 0; }
      50%, 80%  { opacity: 1; }
      100%      { opacity: 0; }
    }
  </style>

  <line class="sol" x1="20" y1="330" x2="380" y2="330" />

  <!-- Hanche : point d'ancrage fixe pour buste et jambes -->
  <circle class="articulation" cx="230" cy="290" r="12" />

  <!-- Pose A : coude gauche vers genou droit replié, jambe gauche tendue basse, bras droit écarté bas -->
  <g class="pose-a">
    <!-- buste enroulé vers la droite -->
    <line class="trait" x1="230" y1="290" x2="150" y2="240" />
    <circle class="tete" cx="120" cy="215" r="30" />
    <!-- bras gauche (actif) vers le genou opposé -->
    <line class="trait" x1="150" y1="240" x2="185" y2="270" />
    <circle class="articulation" cx="185" cy="270" r="9" />
    <!-- bras droit (retrait) écarté bas -->
    <line class="trait" x1="150" y1="240" x2="90" y2="285" />
    <circle class="articulation" cx="90" cy="285" r="9" />

    <!-- jambe droite repliée vers la poitrine -->
    <line class="trait" x1="230" y1="290" x2="200" y2="230" />
    <line class="trait" x1="200" y1="230" x2="210" y2="270" />
    <circle class="articulation" cx="200" cy="230" r="10" />
    <circle class="articulation" cx="210" cy="270" r="10" />

    <!-- jambe gauche tendue basse -->
    <line class="trait" x1="230" y1="290" x2="310" y2="310" />
    <line class="trait" x1="310" y1="310" x2="370" y2="322" />
    <circle class="articulation" cx="310" cy="310" r="10" />
    <circle class="articulation" cx="370" cy="322" r="10" />
  </g>

  <!-- Pose B : miroir — coude droit vers genou gauche replié -->
  <g class="pose-b">
    <line class="trait" x1="230" y1="290" x2="150" y2="240" />
    <circle class="tete" cx="120" cy="215" r="30" />
    <line class="trait" x1="150" y1="240" x2="90" y2="255" />
    <circle class="articulation" cx="90" cy="255" r="9" />
    <line class="trait" x1="150" y1="240" x2="185" y2="290" />
    <circle class="articulation" cx="185" cy="290" r="9" />

    <line class="trait" x1="230" y1="290" x2="215" y2="235" />
    <line class="trait" x1="215" y1="235" x2="175" y2="255" />
    <circle class="articulation" cx="215" cy="235" r="10" />
    <circle class="articulation" cx="175" cy="255" r="10" />

    <line class="trait" x1="230" y1="290" x2="295" y2="315" />
    <line class="trait" x1="295" y1="315" x2="365" y2="315" />
    <circle class="articulation" cx="295" cy="315" r="10" />
    <circle class="articulation" cx="365" cy="315" r="10" />
  </g>
</svg>
