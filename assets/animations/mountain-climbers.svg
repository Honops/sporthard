<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animation mountain climbers">
  <style>
    .trait { stroke: #d4a24c; stroke-width: 20; stroke-linecap: round; fill: none; }
    .articulation { fill: #f5f3ee; }
    .tete { fill: #f5f3ee; stroke: #d4a24c; stroke-width: 6; }
    .sol { stroke: rgba(245,243,238,0.18); stroke-width: 4; stroke-dasharray: 10 10; }

    .pose-arriere { animation: fondu-arriere 1s ease-in-out infinite; }
    .pose-avant { animation: fondu-avant 1s ease-in-out infinite; }

    @keyframes fondu-arriere {
      0%, 25%   { opacity: 1; }
      50%, 75%  { opacity: 0; }
      100%      { opacity: 1; }
    }
    @keyframes fondu-avant {
      0%, 25%   { opacity: 0; }
      50%, 75%  { opacity: 1; }
      100%      { opacity: 0; }
    }
  </style>

  <line class="sol" x1="30" y1="330" x2="370" y2="330" />

  <!-- Buste et bras d'appui : fixes, la planche haute ne bouge pas -->
  <line class="trait" x1="235" y1="200" x2="130" y2="215" />
  <line class="trait" x1="130" y1="215" x2="95" y2="270" />
  <line class="trait" x1="95" y1="270" x2="100" y2="330" />
  <circle class="articulation" cx="130" cy="215" r="11" />
  <circle class="articulation" cx="95" cy="270" r="11" />
  <circle class="articulation" cx="235" cy="200" r="12" />
  <circle class="tete" cx="150" cy="180" r="30" />
  <circle class="articulation" cx="100" cy="330" r="13" />

  <!-- Jambe animée : alterne jambe tendue en arrière / genou ramené vers l'avant -->
  <g class="pose-arriere">
    <line class="trait" x1="235" y1="200" x2="300" y2="268" />
    <line class="trait" x1="300" y1="268" x2="345" y2="330" />
    <circle class="articulation" cx="300" cy="268" r="11" />
    <circle class="articulation" cx="345" cy="330" r="13" />
  </g>

  <g class="pose-avant">
    <line class="trait" x1="235" y1="200" x2="190" y2="235" />
    <line class="trait" x1="190" y1="235" x2="150" y2="295" />
    <circle class="articulation" cx="190" cy="235" r="11" />
    <circle class="articulation" cx="150" cy="295" r="13" />
  </g>
</svg>
